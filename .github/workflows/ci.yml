name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # Note: previously set `RUSTFLAGS: "-D warnings"` globally, which
  # promoted every clippy style nit (needless_range_loop,
  # type_complexity, etc.) into a hard CI failure. cargo check / test
  # still surface real compile errors; clippy stays informational.

jobs:
  rust:
    strategy:
      matrix:
        include:
          - os: macos-14       # arm64
            target: aarch64-apple-darwin
          - os: ubuntu-latest  # x86_64
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace
      # agentc-profiler is a PyO3 extension module and pulls pyo3 with
      # the extension-module feature, which omits the libpython link
      # symbols. Building standalone test/clippy executables for it
      # therefore fails at link time. We exclude it here; the crate is
      # exercised via the python job's maturin build + pytest path.
      - run: cargo test --workspace --exclude agentc-profiler
      - run: cargo clippy --workspace --exclude agentc-profiler

  python:
    strategy:
      matrix:
        include:
          - os: macos-14
          - os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
      - run: pip install maturin
      - run: maturin build --release -m crates/agentc-profiler/Cargo.toml
      - run: pip install target/wheels/*.whl
      # Install the full test extra (dev + openai + anthropic + frameworks +
      # viz + fixtures + baselines). Previously `.[dev]` omitted the provider
      # SDKs, so test_openai_patch / test_anthropic_patch importorskip'd and
      # both provider-patch suites skipped SILENTLY on every CI run (bd-c45).
      - run: pip install -e ".[test]"
      # Build the CLI binary so tests/cli/test_cache_subcommands.py runs
      # instead of skipping on a missing target/debug/agentc (bd-c45).
      - run: cargo build -p agentc-cli
      - run: python -c "from agentc._native import write_span, create_db, query_spans_by_trace; print('native OK:', write_span.__name__)"
      # Fail LOUDLY if the provider SDKs or CLI binary are missing, so a broken
      # install can never again turn these suites into silent skips.
      - run: python -c "import openai, anthropic; print('provider SDKs OK')"
      - run: test -x target/debug/agentc && echo "CLI binary present"
      - run: pytest tests/ -v --tb=short
